# Local test resources only. Copy to wrangler.toml before running the suites.
name = "edge-secrets"
account_id = "00000000000000000000000000000000"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = []

[[kv_namespaces]]
binding = "SECRETS_STORE"
id = "00000000000000000000000000000001"

[[d1_databases]]
binding = "DB"
database_name = "secret-db"
database_id = "00000000-0000-0000-0000-000000000002"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "secret-files"

[triggers]
crons = ["0 * * * *"]

# Bundle hash-wasm's UMD Argon2id build as a text asset so the Worker can
# serve it to the browser at /ui/argon2.v1.js (same-origin, CSP-friendly).
[[rules]]
type = "Text"
globs = ["**/argon2.umd.min.js"]
fallthrough = true

# EFF Long and BIP-39 passphrase wordlists.
[[rules]]
type = "Text"
globs = ["**/*-wordlist.txt"]
fallthrough = true

# QR encoder, served to the browser at /ui/qrcode.v1.js.
[[rules]]
type = "Text"
globs = ["**/qrcode-vendor.js"]
fallthrough = true
