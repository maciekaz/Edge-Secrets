# Publishes the `esecrets` CLI to npm with a provenance attestation.
#
# Provenance is the point of doing this from CI rather than a laptop: npm
# records which repository, commit and workflow produced the tarball, and shows
# it on the package page. For a tool that handles other people's key material,
# that link between "what is on npm" and "what is on GitHub" is worth having.
#
# One-time setup:
#   1. Create an npm automation token (Access Tokens → Generate → Automation).
#   2. Add it as the repository secret NPM_TOKEN.
#   3. Enable 2FA on the npm account. An automation token is exempt from the
#      2FA prompt, which is exactly why the account behind it must be protected.
#
# To release: bump the version in cli/package.json, push, then either publish a
# GitHub release or run this workflow by hand.

name: Publish CLI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for provenance: lets the job mint the OIDC token npm uses to
      # attest where the build came from.
      id-token: write

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
